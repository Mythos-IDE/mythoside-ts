<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%">
  <!-- Background -->
  <rect width="1200" height="400" fill="#09090B" rx="12"/>
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#27272A" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" fill="url(#grid2)" rx="12"/>

  <!-- Left block: Desktop App Window -->
  <rect x="80" y="80" width="400" height="240" fill="#111114" rx="8" stroke="#27272A" stroke-width="1"/>
  <!-- UI details -->
  <line x1="160" y1="80" x2="160" y2="320" stroke="#27272A" stroke-width="1"/>
  <rect x="90" y="100" width="60" height="8" fill="#27272A" rx="4"/>
  <rect x="90" y="120" width="40" height="8" fill="#27272A" rx="4"/>
  <rect x="180" y="100" width="200" height="12" fill="#FAFAFA" rx="4"/>
  <rect x="180" y="130" width="280" height="6" fill="#A1A1AA" rx="3"/>
  <rect x="180" y="145" width="260" height="6" fill="#A1A1AA" rx="3"/>
  <rect x="180" y="160" width="270" height="6" fill="#A1A1AA" rx="3"/>
  
  <!-- Right block: Title -->
  <text x="560" y="160" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="32" font-weight="700">MythosIDE Desktop Client</text>
  <text x="560" y="200" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="18">Tauri + React + TypeScript frontend.</text>
  <text x="560" y="235" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">Provides the distraction-free UI</text>
  <text x="560" y="260" fill="#A1A1AA" font-family="system-ui, sans-serif" font-size="14">while proxying heavy logic to the core engine.</text>
  
  <rect x="560" y="290" width="100" height="28" fill="#FAFAFA" rx="4"/>
  <text x="610" y="309" fill="#09090B" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Tauri</text>
  <rect x="670" y="290" width="100" height="28" fill="#27272A" rx="4"/>
  <text x="720" y="309" fill="#FAFAFA" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">React 19</text>
</svg>
