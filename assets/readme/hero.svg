<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="t d">
  <title id="t">Mythos Desktop — the writing client</title>
  <desc id="d">Mythos Desktop is the Tauri + React client where novelists write; it hosts the mythoside-core engine as a sidecar and renders the editor and diagnostics.</desc>

  <rect width="1200" height="360" rx="24" fill="#0B0E15"/>
  <rect x="1" y="1" width="1198" height="358" rx="23" fill="none" stroke="#20242f"/>
  <path d="M56 74H1144M56 286H1144" stroke="#1b2130"/>

  <text x="56" y="50" fill="#C9A24B" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3">THE DESKTOP CLIENT</text>
  <text x="1144" y="50" text-anchor="end" fill="#7E869A" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="2">MYTHOS-IDE / TS</text>

  <text x="56" y="150" fill="#E8DFCB" font-family="Georgia, 'Times New Roman', serif" font-size="54" font-weight="600">Mythos Desktop</text>
  <text x="58" y="192" fill="#B9B4A4" font-family="Georgia, 'Times New Roman', serif" font-size="21">Where novelists actually write. The engine</text>
  <text x="58" y="220" fill="#B9B4A4" font-family="Georgia, 'Times New Roman', serif" font-size="21">runs as a sidecar; this is the calm surface.</text>
  <text x="58" y="262" fill="#8b93a3" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="1.5">TAURI 2 &#183; REACT 19 &#183; TYPESCRIPT &#183; TAILWIND v4</text>

  <!-- editor window mock -->
  <g transform="translate(690 100)">
    <rect x="0" y="0" width="406" height="168" rx="8" fill="#0E1220" stroke="#20242f"/>
    <path d="M0 28H406" stroke="#1b2130"/>
    <circle cx="16" cy="14" r="3.2" fill="#20242f"/><circle cx="28" cy="14" r="3.2" fill="#20242f"/><circle cx="40" cy="14" r="3.2" fill="#20242f"/>
    <text x="203" y="18" text-anchor="middle" fill="#7E869A" font-family="ui-monospace, monospace" font-size="10">the-ashfall-cycle</text>
    <!-- sidebar -->
    <path d="M104 28V168" stroke="#1b2130"/>
    <g font-family="ui-monospace, monospace" font-size="9.5" fill="#7E869A">
      <text x="16" y="50">book-01</text>
      <text x="24" y="68" fill="#B9B4A4">ch-12.md</text>
      <text x="16" y="86">book-02</text>
      <text x="24" y="104" fill="#C9A24B">ch-03.md</text>
      <text x="16" y="132" fill="#556">characters</text>
      <text x="24" y="150">corvath.md</text>
    </g>
    <!-- prose -->
    <g font-family="Georgia, serif" font-size="13.5" fill="#E8DFCB">
      <text x="122" y="56">The council chamber held its</text>
      <text x="122" y="80">breath. When <tspan fill="#E8DFCB">Lord Corvath</tspan></text>
      <path d="M196 85 q6 -3 12 0 t12 0 t12 0 t12 0" fill="none" stroke="#D2664F" stroke-width="1.4"/>
      <text x="122" y="104" fill="#8b93a3">rose to speak, even the</text>
      <text x="122" y="128" fill="#8b93a3">Tidewatch fell silent.</text>
    </g>
    <text x="122" y="154" fill="#D2664F" font-family="ui-monospace, monospace" font-size="10">MYTH-E012 &#183; referenced after death</text>
  </g>
</svg>
